name: 'Build Angular - CI'

on:
    workflow_dispatch:
    push:
        branches:
        - main

jobs:
    build_angular:
        runs-on: self-hosted
        steps:
            - name: 'Checkout code'
              uses: actions/checkout@v6

            - name: 'Check Node.js version'
              run: node -v

            - name: 'Install dependencies'
              run: npm install

            - name: 'Build Angular application'
              run: npm run build