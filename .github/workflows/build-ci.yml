name: 'Build Angular - CI'

env:
  IIS_APPLICATION_PATH: 'C:\stock-control\angular'
  IIS_APP_POOL_NAME: 'stock-control-front'

on:
    workflow_dispatch:
      inputs:
        commit_sha:
          description: 'Commit SHA to build (optional, defaults to latest commit on main)'
          required: false
          default: ''
          type: string
    push:
        branches:
        - main

jobs:
    build_angular:
        runs-on: self-hosted
        steps:
            - name: 'Checkout code'
              uses: actions/checkout@v6
              with:
                ref: ${{ github.event.inputs.commit_sha || github.ref }}

            - name: 'Check Node.js version'
              run: node -v

            - name: 'Install dependencies'
              run: npm install

            - name: 'Build Angular application'
              run: npm run build-prod
            
            - name: 'Upload build artifacts'
              uses: actions/upload-artifact@v7
              with:
                name: angular-build
                path: dist
    
    deploy:
        needs: build_angular
        runs-on: self-hosted
        steps:
            - name: 'Download build artifacts'
              uses: actions/download-artifact@v7
              with:
                name: angular-build
            
            - name: Stop IIS Application Pool
              run: |
                Import-Module WebAdministration
                Stop-WebAppPool -Name ${{ env.IIS_APP_POOL_NAME }}
                Start-Sleep -Seconds 5
              shell: powershell
            
            - name: Clean IIS Folder (Keeping web.config)
              run: |                
                if (Test-Path ${{ env.IIS_APPLICATION_PATH }}) {
                  Get-ChildItem -Path ${{ env.IIS_APPLICATION_PATH }} -Recurse | 
                    Where-Object { $_.Name -ne "web.config" } | 
                      Remove-Item -Recurse -Force
                }
              shell: powershell

            - name: Deploy to IIS
              run: |
                Copy-Item -Path "browser/*" -Destination ${{ env.IIS_APPLICATION_PATH }} -Recurse -Force
                
                if (Test-Path "web.config") {
                  Copy-Item -Path "web.config" -Destination ${{ env.IIS_APPLICATION_PATH }} -Force
                }
              shell: powershell

            - name: Start IIS Application Pool
              run: |
                Import-Module WebAdministration
                Start-WebAppPool -Name ${{ env.IIS_APP_POOL_NAME }}
              shell: powershell